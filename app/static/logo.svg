<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Kite Studio">
  <defs>
    <linearGradient id="kiteBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="kiteShape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#kiteBg)"/>

  <!-- Kite diamond -->
  <g transform="translate(50 44)">
    <path d="M 0 -26
             L 18 0
             L 0 26
             L -18 0
             Z"
          fill="url(#kiteShape)"
          stroke="#ffffff"
          stroke-width="1.5"
          stroke-linejoin="round"/>
    <!-- Inner cross lines -->
    <path d="M 0 -26 L 0 26 M -18 0 L 18 0"
          stroke="#7c3aed"
          stroke-width="1.2"
          stroke-opacity="0.55"/>
  </g>

  <!-- Tail with a small bow -->
  <path d="M 50 70 Q 56 78 50 84 T 50 94"
        fill="none"
        stroke="#ffffff"
        stroke-width="2.4"
        stroke-linecap="round"
        opacity="0.9"/>
  <circle cx="50" cy="94" r="2.6" fill="#ffffff"/>
</svg>